openapi: 3.0.3
info:
  title: MAISON Restaurant API
  version: 1.0.0
  description: API каталога, гостевой корзины, авторизации сотрудников и смен MAISON
paths:
  /api/v1/cart/:
    get:
      operationId: v1_cart_retrieve
      summary: Получить гостевую корзину
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Секретный токен гостевой корзины
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НедействительныйТокен:
                  value:
                    detail: Недействительный или просроченный токен корзины.
                  summary: Недействительный токен
          description: Отсутствующий, неверный или просроченный токен.
    post:
      operationId: v1_cart_create
      summary: Создать гостевую корзину
      tags:
      - v1
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartCreateResponse'
          description: ''
  /api/v1/cart/items/:
    post:
      operationId: v1_cart_items_create
      summary: Добавить блюдо в корзину
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Секретный токен гостевой корзины
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НеверноеКоличество:
                  value:
                    quantity:
                    - Ensure this value is greater than or equal to 1.
                  summary: Неверное количество
          description: Неверное количество либо недоступное блюдо.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НедействительныйТокен:
                  value:
                    detail: Недействительный или просроченный токен корзины.
                  summary: Недействительный токен
          description: Отсутствующий, неверный или просроченный токен.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ПозицияНеНайдена:
                  value:
                    detail: Позиция корзины не найдена.
                  summary: Позиция не найдена
          description: Блюдо или позиция корзины не найдены (в том числе в другой
            корзине).
  /api/v1/cart/items/{id}/:
    patch:
      operationId: v1_cart_items_partial_update
      summary: Изменить количество блюда
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Секретный токен гостевой корзины
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdate'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НеверноеКоличество:
                  value:
                    quantity:
                    - Ensure this value is greater than or equal to 1.
                  summary: Неверное количество
          description: Неверное количество либо недоступное блюдо.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НедействительныйТокен:
                  value:
                    detail: Недействительный или просроченный токен корзины.
                  summary: Недействительный токен
          description: Отсутствующий, неверный или просроченный токен.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ПозицияНеНайдена:
                  value:
                    detail: Позиция корзины не найдена.
                  summary: Позиция не найдена
          description: Блюдо или позиция корзины не найдены (в том числе в другой
            корзине).
    delete:
      operationId: v1_cart_items_destroy
      summary: Удалить позицию корзины
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Секретный токен гостевой корзины
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '204':
          description: Позиция удалена; тело ответа отсутствует.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НедействительныйТокен:
                  value:
                    detail: Недействительный или просроченный токен корзины.
                  summary: Недействительный токен
          description: Отсутствующий, неверный или просроченный токен.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ПозицияНеНайдена:
                  value:
                    detail: Позиция корзины не найдена.
                  summary: Позиция не найдена
          description: Блюдо или позиция корзины не найдены (в том числе в другой
            корзине).
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      summary: Активные категории
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/dishes/:
    get:
      operationId: v1_dishes_list
      summary: Список блюд
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Slug категории
      - in: query
        name: featured
        schema:
          type: boolean
        description: true/false
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDishListList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НекорректныйFeatured:
                  value:
                    featured:
                    - Некорректное значение. Ожидается true или false.
                  summary: Некорректный featured
          description: Некорректный параметр featured или номер страницы.
  /api/v1/dishes/{slug}/:
    get:
      operationId: v1_dishes_retrieve
      summary: Детали блюда
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                БлюдоНеНайдено:
                  value:
                    detail: No Dish matches the given query.
                  summary: Блюдо не найдено
          description: Блюдо не найдено, скрыто или его категория неактивна.
  /api/v1/reservations/:
    post:
      operationId: v1_reservations_create
      description: Отправить публичную заявку на бронирование.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicReservationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicReservationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicReservationCreate'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReservationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/staff/auth/login/:
    post:
      operationId: v1_staff_auth_login_create
      description: 'Фиксированный срок сессии от входа: 3 дня или 30 дней с remember_me.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/auth/logout/:
    post:
      operationId: v1_staff_auth_logout_create
      description: Отзывает refresh. Выданный access действует до истечения своего
        срока.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/auth/me/:
    get:
      operationId: v1_staff_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/auth/password-reset/:
    post:
      operationId: v1_staff_auth_password_reset_create
      description: В локальной среде выводит письмо в консоль.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordReset'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/auth/password-reset/confirm/:
    post:
      operationId: v1_staff_auth_password_reset_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/auth/refresh/:
    post:
      operationId: v1_staff_auth_refresh_create
      description: Новый access в пределах исходного срока сессии.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Refresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Refresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refresh'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/reservations/:
    get:
      operationId: staff_reservations_list
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Дата брони
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы
      - in: query
        name: page_size
        schema:
          type: integer
        description: Размер страницы (до 100)
      - in: query
        name: search
        schema:
          type: string
        description: Имя или телефон
      - in: query
        name: status
        schema:
          type: string
        description: Статус брони
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReservationPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    post:
      operationId: v1_staff_reservations_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffReservationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffReservationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffReservationCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReservationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/staff/reservations/{id}/:
    get:
      operationId: staff_reservations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReservationDetail'
          description: ''
    patch:
      operationId: v1_staff_reservations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStaffReservationUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStaffReservationUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStaffReservationUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReservationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/staff/reservations/{id}/arrive/:
    post:
      operationId: v1_staff_reservations_arrive_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReservationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/staff/reservations/{id}/assign-table/:
    post:
      operationId: v1_staff_reservations_assign_table_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignTable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignTable'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReservationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/staff/reservations/{id}/cancel/:
    post:
      operationId: v1_staff_reservations_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReservationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/staff/reservations/{id}/confirm/:
    post:
      operationId: v1_staff_reservations_confirm_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReservationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/staff/reservations/{id}/history/:
    get:
      operationId: v1_staff_reservations_history_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationHistory'
          description: ''
  /api/v1/staff/shifts/{id}/employees/:
    get:
      operationId: v1_staff_shifts_employees_list
      summary: Получить состав смены
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftEmployee'
          description: ''
        '404':
          description: Смена, сотрудник или стол не найдены.
        '401':
          description: Требуется действующий JWT.
        '403':
          description: У сотрудника нет прав на эту операцию.
    post:
      operationId: v1_staff_shifts_employees_create
      summary: Добавить сотрудника в смену
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddShiftEmployee'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddShiftEmployee'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddShiftEmployee'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftEmployee'
          description: ''
        '400':
          description: Некорректные данные или нарушено правило операции.
        '404':
          description: Смена, сотрудник или стол не найдены.
        '401':
          description: Требуется действующий JWT.
        '403':
          description: У сотрудника нет прав на эту операцию.
  /api/v1/staff/shifts/{id}/tables/{table_id}/:
    put:
      operationId: v1_staff_shifts_tables_update
      summary: Закрепить стол за официантом
      parameters:
      - in: path
