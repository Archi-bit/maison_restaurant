name: Backend tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: maison_ci
          POSTGRES_USER: maison_ci
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maison_ci -d maison_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: github-actions-only-not-production
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: maison_ci
      DB_USER: maison_ci
      DB_PASSWORD: test-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Run all tests on PostgreSQL
        run: python manage.py test --noinput -v 2
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/maison-schema.yaml --validate
