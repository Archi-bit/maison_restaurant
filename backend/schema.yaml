openapi: 3.0.3
info:
  title: MAISON Restaurant API
  version: 1.0.0
  description: API каталога, гостевой корзины и авторизации сотрудников MAISON
paths:
  /api/v1/cart/:
    get:
      operationId: v1_cart_retrieve
      summary: Получить гостевую корзину
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Секретный токен гостевой корзины
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НедействительныйТокен:
                  value:
                    detail: Недействительный или просроченный токен корзины.
                  summary: Недействительный токен
          description: Отсутствующий, неверный или просроченный токен.
    post:
      operationId: v1_cart_create
      summary: Создать гостевую корзину
      tags:
      - v1
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartCreateResponse'
          description: ''
  /api/v1/cart/items/:
    post:
      operationId: v1_cart_items_create
      summary: Добавить блюдо в корзину
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Секретный токен гостевой корзины
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НеверноеКоличество:
                  value:
                    quantity:
                    - Ensure this value is greater than or equal to 1.
                  summary: Неверное количество
          description: Неверное количество либо недоступное блюдо.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НедействительныйТокен:
                  value:
                    detail: Недействительный или просроченный токен корзины.
                  summary: Недействительный токен
          description: Отсутствующий, неверный или просроченный токен.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ПозицияНеНайдена:
                  value:
                    detail: Позиция корзины не найдена.
                  summary: Позиция не найдена
          description: Блюдо или позиция корзины не найдены (в том числе в другой
            корзине).
  /api/v1/cart/items/{id}/:
    patch:
      operationId: v1_cart_items_partial_update
      summary: Изменить количество блюда
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Секретный токен гостевой корзины
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdate'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НеверноеКоличество:
                  value:
                    quantity:
                    - Ensure this value is greater than or equal to 1.
                  summary: Неверное количество
          description: Неверное количество либо недоступное блюдо.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НедействительныйТокен:
                  value:
                    detail: Недействительный или просроченный токен корзины.
                  summary: Недействительный токен
          description: Отсутствующий, неверный или просроченный токен.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ПозицияНеНайдена:
                  value:
                    detail: Позиция корзины не найдена.
                  summary: Позиция не найдена
          description: Блюдо или позиция корзины не найдены (в том числе в другой
            корзине).
    delete:
      operationId: v1_cart_items_destroy
      summary: Удалить позицию корзины
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Секретный токен гостевой корзины
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '204':
          description: Позиция удалена; тело ответа отсутствует.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НедействительныйТокен:
                  value:
                    detail: Недействительный или просроченный токен корзины.
                  summary: Недействительный токен
          description: Отсутствующий, неверный или просроченный токен.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ПозицияНеНайдена:
                  value:
                    detail: Позиция корзины не найдена.
                  summary: Позиция не найдена
          description: Блюдо или позиция корзины не найдены (в том числе в другой
            корзине).
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      summary: Активные категории
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/dishes/:
    get:
      operationId: v1_dishes_list
      summary: Список блюд
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Slug категории
      - in: query
        name: featured
        schema:
          type: boolean
        description: true/false
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDishListList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НекорректныйFeatured:
                  value:
                    featured:
                    - Некорректное значение. Ожидается true или false.
                  summary: Некорректный featured
          description: Некорректный параметр featured или номер страницы.
  /api/v1/dishes/{slug}/:
    get:
      operationId: v1_dishes_retrieve
      summary: Детали блюда
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                БлюдоНеНайдено:
                  value:
                    detail: No Dish matches the given query.
                  summary: Блюдо не найдено
          description: Блюдо не найдено, скрыто или его категория неактивна.
  /api/v1/staff/auth/login/:
    post:
      operationId: v1_staff_auth_login_create
      description: 'Фиксированный срок сессии от входа: 3 дня или 30 дней с remember_me.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/auth/logout/:
    post:
      operationId: v1_staff_auth_logout_create
      description: Отзывает refresh. Выданный access действует до истечения своего
        срока.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/auth/me/:
    get:
      operationId: v1_staff_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/auth/password-reset/:
    post:
      operationId: v1_staff_auth_password_reset_create
      description: В локальной среде выводит письмо в консоль.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordReset'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/auth/password-reset/confirm/:
    post:
      operationId: v1_staff_auth_password_reset_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
  /api/v1/staff/auth/refresh/:
    post:
      operationId: v1_staff_auth_refresh_create
      description: Новый access в пределах исходного срока сессии.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Refresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Refresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refresh'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
          description: ''
components:
  schemas:
    BadgeEnum:
      enum:
      - hit
      - chef
      - favorite
      type: string
      description: |-
        * `hit` - Хит
        * `chef` - Шеф рекомендует
        * `favorite` - Любимый десерт
    BlankEnum:
      enum:
      - ''
    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        items_count:
          type: integer
          readOnly: true
        subtotal:
          type: string
          readOnly: true
        total:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
      required:
      - currency
      - id
      - items
      - items_count
      - subtotal
      - total
    CartCreateResponse:
      type: object
      properties:
        cart_token:
          type: string
        cart:
          $ref: '#/components/schemas/Cart'
      required:
      - cart
      - cart_token
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        dish_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        line_total:
          type: string
          readOnly: true
      required:
      - dish_id
      - id
      - image
      - line_total
      - name
      - quantity
      - unit_price
    CartItemCreate:
      type: object
      properties:
        dish_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 99
          minimum: 1
      required:
      - dish_id
      - quantity
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          oneOf:
          - type: string
            maxLength: 120
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      required:
      - id
      - name
    DishDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          oneOf:
          - type: string
            maxLength: 220
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        short_description:
          type: string
          maxLength: 255
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        image:
          type: string
          format: uri
        badge:
          oneOf:
          - $ref: '#/components/schemas/BadgeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_featured:
          type: boolean
        is_available:
          type: boolean
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
      required:
      - category
      - id
      - image
      - name
      - price
    DishList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          oneOf:
          - type: string
            maxLength: 220
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        short_description:
          type: string
          maxLength: 255
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        image:
          type: string
          format: uri
        badge:
          oneOf:
          - $ref: '#/components/schemas/BadgeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_featured:
          type: boolean
        is_available:
          type: boolean
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
      required:
      - category
      - id
      - image
      - name
      - price
    EmployeeProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        work_email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        phone:
          type: string
          readOnly: true
      required:
      - full_name
      - id
      - phone
      - role
      - work_email
    Login:
      type: object
      properties:
        work_email:
          type: string
          format: email
          writeOnly: true
          maxLength: 254
        password:
          type: string
          writeOnly: true
        remember_me:
          type: boolean
          writeOnly: true
          default: false
        profile:
          allOf:
          - $ref: '#/components/schemas/EmployeeProfile'
          readOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - profile
      - refresh
      - work_email
    PaginatedDishListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/DishList'
    PasswordReset:
      type: object
      properties:
        work_email:
          type: string
          format: email
          maxLength: 254
      required:
      - work_email
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
          writeOnly: true
        new_password_confirm:
          type: string
          writeOnly: true
      required:
      - new_password
      - new_password_confirm
      - token
      - uid
    PatchedCartItemUpdate:
      type: object
      properties:
        quantity:
          type: integer
          maximum: 99
          minimum: 1
    Refresh:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    RoleEnum:
      enum:
      - owner
      - administrator
      - waiter
      - chef
      type: string
      description: |-
        * `owner` - Владелец
        * `administrator` - Администратор
        * `waiter` - Официант
        * `chef` - Повар
    StaffDetail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    TokenBlacklist:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
